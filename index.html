<!-- ian-vault-v1 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ian · Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2420;
      --mute: #5e6e66;
      --paper: #efe8dc;
      --sand: #e4d9c8;
      --panel: #f7f1e7;
      --sea: #2a6b5a;
      --ember: #c45a2c;
      --line: rgba(26, 36, 32, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Source Sans 3", "PingFang SC", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* lock */
    .lock-screen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 75% 15%, rgba(42,107,90,0.32), transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 85%, rgba(196,90,44,0.2), transparent 50%),
        linear-gradient(160deg, #1c2e28, #121c18 48%, #1a2621);
      color: #efe8dc;
      padding: 24px;
    }
    .lock-screen.hidden { display: none; }
    .lock-brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin-bottom: 12px;
      text-align: center;
    }
    .lock-brand em { font-style: italic; color: #e8a06a; font-weight: 500; }
    .lock-sub { color: rgba(239,232,220,0.68); margin-bottom: 28px; font-size: 0.98rem; }
    .lock-form { width: min(300px, 100%); display: flex; flex-direction: column; gap: 10px; }
    .lock-input {
      width: 100%; padding: 13px 14px; border-radius: 2px;
      border: 1px solid rgba(239,232,220,0.28); background: rgba(0,0,0,0.25);
      color: #efe8dc; font-size: 1.05rem; outline: none; letter-spacing: 0.12em; text-align: center;
    }
    .lock-input:focus { border-color: #e8a06a; }
    .lock-btn {
      padding: 12px; border: none; border-radius: 2px; background: #e8a06a;
      color: #1a2420; font-weight: 600; font-size: 0.98rem; cursor: pointer;
    }
    .lock-error { color: #f0a090; font-size: 0.85rem; min-height: 1.2em; text-align: center; }
    .lock-hint { margin-top: 16px; font-size: 0.78rem; color: rgba(239,232,220,0.42); }
    .lock-remember {
      font-size: 0.82rem; color: rgba(239,232,220,0.62);
      display: flex; gap: 6px; align-items: center; justify-content: center;
    }
    .lock-btn:disabled { opacity: 0.6; }
    .lock-public { margin-top: 34px; width: min(340px, 100%); }
    .lock-public-title {
      font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(239,232,220,0.45); text-align: center; margin-bottom: 10px;
    }
    .lock-public a {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      padding: 10px 2px; border-top: 1px solid rgba(239,232,220,0.12);
      color: #efe8dc; text-decoration: none; font-size: 0.92rem;
    }
    .lock-public a:last-child { border-bottom: 1px solid rgba(239,232,220,0.12); }
    .lock-public a span { font-size: 0.76rem; color: rgba(239,232,220,0.5); white-space: nowrap; }
    .lock-public a:hover { color: #e8a06a; }
    .lock-screen { overflow-y: auto; }
    .lock-screen > .lock-brand { margin-top: auto; }
    .lock-screen > .lock-public { margin-bottom: auto; }
    .pub-tag { background: rgba(94,110,102,0.14) !important; color: var(--mute) !important; }
    .lock-out {
      border: 1px solid var(--line); background: var(--panel); color: var(--mute);
      font-size: 0.8rem; padding: 5px 10px; border-radius: 2px; cursor: pointer;
    }

    .app.hidden { display: none; }
    .top {
      position: sticky; top: 0; z-index: 50;
      padding: 14px 20px 12px;
      background: rgba(239,232,220,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .top-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 12px;
    }
    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.45rem; font-weight: 600; letter-spacing: -0.02em;
    }
    .brand em { font-style: italic; color: var(--ember); }
    .search {
      width: 100%; max-width: 420px; margin: 0 auto;
      display: block; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 2px;
      background: var(--panel); font-size: 0.95rem; outline: none;
    }
    .search:focus { border-color: var(--sea); }

    .tabs {
      display: flex; gap: 8px; padding: 12px 20px 0;
      overflow-x: auto;
    }
    .tab {
      flex: 0 0 auto; padding: 8px 14px; border: 1px solid var(--line);
      background: var(--panel); border-radius: 999px; font-size: 0.88rem;
      color: var(--mute); cursor: pointer; font-weight: 500;
    }
    .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .mods {
      display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }
    .mod {
      flex: 0 0 auto; padding: 7px 12px; border: 1px solid transparent;
      background: transparent; border-radius: 2px; font-size: 0.88rem;
      color: var(--mute); cursor: pointer; font-weight: 500;
    }
    .mod.active { background: var(--sand); color: var(--ink); }
    .mods.hidden { display: none; }

    .wrap { max-width: 880px; margin: 0 auto; padding: 20px 20px 72px; }
    .group-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem; font-weight: 550; margin: 28px 0 12px;
      letter-spacing: -0.01em;
    }
    .group-title:first-child { margin-top: 4px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    a.item {
      display: grid; grid-template-columns: 72px 1fr; gap: 12px;
      padding: 14px 14px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 2px; text-decoration: none; color: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    a.item:hover { background: #fffaf2; border-color: var(--sea); }
    .item-date {
      font-size: 0.78rem; color: var(--mute); font-variant-numeric: tabular-nums;
      padding-top: 3px;
    }
    .item-title { font-weight: 600; font-size: 0.98rem; line-height: 1.35; margin-bottom: 4px; }
    .item-desc { font-size: 0.88rem; color: var(--mute); line-height: 1.4; }
    .item-tag {
      display: inline-block; margin-top: 8px; font-size: 0.72rem; font-weight: 600;
      padding: 2px 8px; background: rgba(42,107,90,0.12); color: var(--sea); border-radius: 2px;
    }
    .empty { text-align: center; color: var(--mute); padding: 48px 12px; }
    .foot {
      margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
      font-size: 0.82rem; color: var(--mute); text-align: center;
    }
  </style>
</head>

  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  async function derive(pwd, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw, p) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.ct));
    return new TextDecoder().decode(pt);
  }
  function load(salt) {
    for (const st of [sessionStorage, localStorage]) {
      try {
        const d = JSON.parse(st.getItem(STORE) || 'null');
        if (d && d.s === salt && (!d.exp || d.exp > Date.now())) return unb64(d.k);
      } catch (e) {}
    }
    return null;
  }
  function save(salt, raw, remember) {
    const k = b64(raw);
    try { sessionStorage.setItem(STORE, JSON.stringify({ s: salt, k })); } catch (e) {}
    try {
      if (remember) localStorage.setItem(STORE, JSON.stringify({ s: salt, k, exp: Date.now() + DAYS * 864e5 }));
      else localStorage.removeItem(STORE);
    } catch (e) {}
  }
  function forget() {
    try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {}
  }
  // 用已保存的 key 尝试解密；失败返回 null
  async function tryStored(p) {
    const raw = load(p.salt);
    if (!raw) return null;
    try { return await decrypt(raw, p); } catch (e) { forget(); return null; }
  }
  // 用密码解密；成功则按 remember 保存派生 key（不保存明文密码）
  async function withPassword(p, pwd, remember) {
    const raw = await derive(pwd, p.salt, p.iter);
    const text = await decrypt(raw, p);
    save(p.salt, raw, remember);
    return text;
  }
  return { tryStored, withPassword, forget };
})();

  const MODULES = {
    work:  { label: '工作', color: '#c45a2c' },
    study: { label: '学习', color: '#2a6b5a' },
    life:  { label: '生活', color: '#2f5c78' },
    money: { label: '理财', color: '#9e7a30' },
  };
  const PUBLIC_SITES = [
    { title: '指标学堂', desc: '市场指标入门与互动练习。', url: '/market-indicator-academy/', tag: '公开' },
    { title: '大模型面试学堂', desc: '大模型面试知识点与练习。', url: '/llm-interview-academy/', tag: '公开' },
    { title: 'Market Pulse', desc: '每日收盘快照。', url: '/market-pulse/', tag: '公开' },
    { title: '交易日题材复盘', desc: 'A 股 / 美股每日题材复盘归档。', url: '/my-notes/market-reviews/', tag: '公开' },
    { title: '小白财富', desc: '财富规划（站点自带加密）。', url: '/xiaobai-wealth/', tag: '需密码' },
  ];

  // module: work | study | life | money；解锁后由 ITEMS_ENC 解密得到
  let ITEMS = [];

  let view = 'module'; // module | date
  let mod = 'all';
  let q = '';

  function showApp(items) {
    ITEMS = items;
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
  }
  async function verifyPassword() {
    const input = document.getElementById('lockInput');
    const error = document.getElementById('lockError');
    const btn = document.getElementById('lockBtn');
    const pwd = input.value;
    if (!pwd) { error.textContent = '请输入密码'; return; }
    btn.disabled = true; error.textContent = '解密中…';
    try {
      const text = await IanVault.withPassword(ITEMS_ENC, pwd, document.getElementById('lockRemember').checked);
      error.textContent = '';
      showApp(JSON.parse(text));
    } catch (e) {
      error.textContent = '密码错误'; input.value = ''; input.focus();
    } finally { btn.disabled = false; }
  }

  function filtered() {
    const qq = q.trim().toLowerCase();
    return ITEMS.filter((it) => {
      const okMod = view !== 'module' || mod === 'all' || it.module === mod;
      const okQ = !qq || it.title.toLowerCase().includes(qq) || (it.desc || '').toLowerCase().includes(qq);
      return okMod && okQ;
    });
  }

  const escHtml = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function itemCard(it) {
    const m = MODULES[it.module];
    return `<a class="item" href="${it.url}">
      <div class="item-date">${it.date.slice(5)}</div>
      <div>
        <div class="item-title">${it.title}</div>
        <div class="item-desc">${it.desc || ''}</div>
        <span class="item-tag" style="background:${m.color}22;color:${m.color}">${m.label}</span>
      </div>
    </a>`;
  }

  function render() {
    const box = document.getElementById('content');
    const items = filtered();
    document.getElementById('modBar').classList.toggle('hidden', view !== 'module');

    if (!items.length) {
      box.innerHTML = '<div class="empty">没有匹配的内容</div>';
      return;
    }

    if (view === 'module') {
      const order = ['work', 'study', 'life', 'money'];
      const used = order.filter((k) => items.some((i) => i.module === k));
      box.innerHTML = used.map((k) => {
        const list = items.filter((i) => i.module === k)
          .sort((a, b) => b.date.localeCompare(a.date));
        return `<h2 class="group-title">${MODULES[k].label}</h2>
          <div class="list">${list.map(itemCard).join('')}</div>`;
      }).join('');
      return;
    }

    // by date
    const byDate = {};
    items.forEach((it) => {
      (byDate[it.date] ||= []).push(it);
    });
    const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
    box.innerHTML = dates.map((d) => {
      const list = byDate[d].sort((a, b) => a.title.localeCompare(b.title, 'zh'));
      return `<h2 class="group-title">${d}</h2>
        <div class="list">${list.map(itemCard).join('')}</div>`;
    }).join('');
  }

  document.getElementById('lockBtn').addEventListener('click', verifyPassword);
  document.getElementById('lockInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyPassword();
  });
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      view = btn.dataset.view;
      render();
    });
  });
  document.querySelectorAll('.mod').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mod').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      mod = btn.dataset.mod;
      render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    q = e.target.value;
    render();
  });

  document.getElementById('lockOut').addEventListener('click', () => { IanVault.forget(); location.reload(); });
  document.getElementById('publicList').innerHTML = PUBLIC_SITES.map((it) => `<a class="item" href="${it.url}">
      <div class="item-date">↗</div>
      <div>
        <div class="item-title">${escHtml(it.title)}</div>
        <div class="item-desc">${escHtml(it.desc)}</div>
        <span class="item-tag pub-tag">${it.tag}</span>
      </div>
    </a>`).join('');
  IanVault.tryStored(ITEMS_ENC).then((text) => { if (text) showApp(JSON.parse(text)); });
  </script>
</body>
</html>
