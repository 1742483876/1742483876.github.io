<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>打开新版 · 脉冲</title><style>html{color-scheme:light;font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f3f6fb;color:#18263b}body{margin:0;display:grid;place-items:center;min-height:100dvh}main{box-sizing:border-box;width:min(540px,calc(100% - 32px));background:white;border:1px solid #dce4ef;border-radius:24px;padding:32px;box-shadow:0 12px 60px #1836610a}small{color:#246bfd;letter-spacing:2px}h1{font-size:28px;margin:9px 0}p{color:#65758b;font-size:14px}button,a{font:inherit;border:0;background:#246bfd;color:white;border-radius:10px;padding:12px 18px;display:inline-block;text-decoration:none;cursor:pointer}button:disabled{opacity:.55}a{background:#edf3ff;color:#246bfd;font-size:13px;margin-top:12px}[hidden]{display:none}</style></head><body><main><small>脉冲 / 随身复盘</small><h1>正在打开新版</h1><p>更新页面和导航，保留浏览过的行情缓存。</p><p id="status" role="status">正在检查版本…</p><button id="retry" type="button" hidden>重新尝试</button><br><a id="currentPage" href="./">返回当前可用页面</a></main><script>
'use strict';
const EXPECTED='6ee45ae91843277b',status=document.getElementById('status'),retry=document.getElementById('retry');
const validRoutes=['chart','signals','sectors','temperature','research','help'];
const requested=location.hash.slice(1),page=validRoutes.includes(requested)?requested:'signals';
function destination(build){const incoming=new URLSearchParams(location.search),query=new URLSearchParams();for(const key of ['symbol','archive','date','grade','side']){const value=incoming.get(key);if(value!==null)query.set(key,value);}if(build)query.set('release',build);const search=query.toString();return './'+(search?'?'+search:'')+'#'+page;}
document.getElementById('currentPage').href=destination();
function workerVersion(worker){return new Promise(resolve=>{if(!worker){resolve(null);return;}const channel=new MessageChannel();let done=false;const timer=setTimeout(()=>finish(null),1800);function finish(value){if(done)return;done=true;clearTimeout(timer);channel.port1.close();resolve(value);}channel.port1.onmessage=e=>{if(e.data?.type==='PULSE_VERSION')finish(e.data.build);};worker.postMessage({type:'PULSE_VERSION'},[channel.port2]);});}
function bounded(promise,deadline){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('更新检查超时，请稍后重试')),Math.max(1,deadline-Date.now()));})]).finally(()=>clearTimeout(timer));}
async function upgrade(){retry.hidden=true;retry.disabled=true;const deadline=Date.now()+35000;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);let info;try{const response=await fetch('./build-info.json?upgrade='+Date.now(),{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('版本检查暂未完成');info=await response.json();}finally{clearTimeout(timer);}const expected=info.build_id;if(!/^[a-f0-9]{16}$/.test(expected))throw new Error('版本信息无效');if(!('serviceWorker'in navigator)){location.replace(destination(expected));return;}status.textContent='正在安装页面资源，请保持联网。已缓存图表不会清除。';const registration=await bounded(navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}),deadline);await bounded(registration.update(),deadline);while(Date.now()<deadline){const version=await workerVersion(navigator.serviceWorker.controller);if(version===expected){status.textContent='新版已就绪，正在进入…';location.replace(destination());return;}if(registration.installing?.state==='redundant')throw new Error('页面资源尚未完整下载');await new Promise(resolve=>setTimeout(resolve,500));}throw new Error('网络较慢，更新还未就绪，请稍后重试');}catch(error){status.textContent=(navigator.onLine?error.message:'当前离线，请联网后重试')+'。当前缓存已保留。';retry.hidden=false;}finally{retry.disabled=false;}}
retry.addEventListener('click',upgrade);upgrade();
</script></body></html>
